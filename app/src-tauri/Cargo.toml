[package]
name = "forever-launcher"
version = "1.0.0"
description = "Forever Launcher - WoW Forever 1.60.1.70532 on a TrinityCore server"
edition = "2021"
publish = false

[lib]
name = "forever_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "rt", "macros", "net"] }
base64 = "0.22"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "5"
memchr = "2"

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "rustls-tls-webpki-roots"] }
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
# Windows: the system TLS (schannel), no C code to build
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
