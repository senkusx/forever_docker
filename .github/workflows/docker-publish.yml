name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trinitycore
            context: .
            file: ./Dockerfile
            cache_scope: trinitycore-amd64
            build_args: BUILD_JOBS=2
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: trinitycore
            context: .
            file: ./Dockerfile
            cache_scope: trinitycore-arm64
            build_args: BUILD_JOBS=2
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: web
            context: ./web
            file: ./web/Dockerfile
            cache_scope: web-amd64
            build_args: ""
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - name: web
            context: ./web
            file: ./web/Dockerfile
            cache_scope: web-arm64
            build_args: ""
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
            type=ref,event=tag,suffix=-${{ matrix.arch }}
            type=sha,format=long,suffix=-${{ matrix.arch }}
            type=raw,value=latest,suffix=-${{ matrix.arch }},enable={{is_default_branch}}

      - name: Resolve TrinityCore source revision
        id: trinitycore
        if: matrix.name == 'trinitycore'
        run: |
          revision="$(git ls-remote https://github.com/advocaite/TrinityCore.git refs/heads/forever | cut -f1)"
          test -n "$revision"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.name == 'trinitycore' && format('TC_COMMIT={0}', steps.trinitycore.outputs.revision) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,scope=${{ matrix.cache_scope }},mode=max

  manifest:
    name: Publish ${{ matrix.name }} multi-platform manifest
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        name: [trinitycore, web]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish multi-platform tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "$TAGS"
