name: forever

x-trinity-env: &trinity-env
  TZ: ${TZ:-UTC}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_USER: ${DB_USER:-trinity}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

services:
  mysql:
    image: mysql:8.0
    networks: [forever]
    restart: unless-stopped
    # when memory runs out, the kernel kills something else first (a build, a test server), not the game
    oom_score_adj: -800
    environment:
      TZ: ${TZ:-UTC}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
    command:
      - --max-allowed-packet=1G
      - --skip-log-bin
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-512M}
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    # MySQL is only reachable from the other containers. Uncomment for a local admin tool (never expose it publicly).
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  worldserver:
    build:
      context: .
      args:
        TC_REF: ${TC_REF:-forever}
        TC_COMMIT: ${TC_COMMIT:-}
        BUILD_JOBS: ${BUILD_JOBS:-4}
    image: ${TRINITY_IMAGE:-ghcr.io/senkusx/forever_docker-trinitycore:latest}
    pull_policy: always
    command: ["worldserver"]
    networks: [forever]
    restart: unless-stopped
    # when memory runs out, the kernel kills something else first (a build, a test server), not the game
    oom_score_adj: -800
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *trinity-env
      MMAP_PATHFINDING: ${MMAP_PATHFINDING:-0}
      CLIENT_BUILD: ${CLIENT_BUILD:-}
      PACKET_LOG: ${PACKET_LOG:-0}   # 1 = packet log (diagnostics, holds chat)
      REALM_PORT: ${REALM_PORT:-8085}
      SOAP_ENABLED: "1"   # for the website; port 7878 is never published
      COMPANIONS_LLM: ${COMPANIONS_LLM:-0}   # 1 = bots answer chat through the brain service (profile "brain")
    # interactive console: docker compose attach worldserver  (leave with Ctrl+P, Ctrl+Q)
    stdin_open: true
    tty: true
    stop_grace_period: 2m
    ports:
      - "${REALM_PORT:-8085}:${REALM_PORT:-8085}"
    volumes:
      - ${DATA_DIR:-./data}:/opt/trinitycore/data:ro
      - ./overrides:/opt/trinitycore/overrides:ro
      - logs:/opt/trinitycore/logs

  bnetserver:
    image: ${TRINITY_IMAGE:-ghcr.io/senkusx/forever_docker-trinitycore:latest}
    pull_policy: always
    command: ["bnetserver"]
    networks: [forever]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      worldserver:
        condition: service_started
    environment:
      <<: *trinity-env
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-127.0.0.1}
      REALM_LOCAL_ADDRESS: ${REALM_LOCAL_ADDRESS:-127.0.0.1}
      REALM_LOCAL_SUBNET_MASK: ${REALM_LOCAL_SUBNET_MASK:-255.255.255.0}
      REALM_NAME: ${REALM_NAME:-Forever}
      REALM_PORT: ${REALM_PORT:-8085}
      CLIENT_BUILD: ${CLIENT_BUILD:-}   # waits for worldserver to add it to auth.build_info
    # bnetserver refuses to start if it cannot resolve the LoginREST hostname itself
    extra_hosts:
      - "trinity.actual.battle.net:${PUBLIC_ADDRESS:-127.0.0.1}"
    ports:
      - "1119:1119"
      - "8081:8081"
    volumes:
      - ${CERTS_DIR:-./certs}:/opt/trinitycore/certs:ro
      - ./overrides:/opt/trinitycore/overrides:ro
      - logs:/opt/trinitycore/logs

  # Account sign-up website. Behind Traefik or Dokploy: route your domain to this service, port 8000.
  web:
    build: ./web
    image: ${WEB_IMAGE:-ghcr.io/senkusx/forever_docker-web:latest}
    pull_policy: always
    networks: [forever]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
      SOAP_URL: http://worldserver:7878/
      SOAP_USER: ${SOAP_USER:-FOREVERWEB}
      SOAP_PASSWORD: ${SOAP_PASSWORD:?set SOAP_PASSWORD in .env}
      SERVER_NAME: ${REALM_NAME:-Forever}
      GAME_VERSION: 1.60.1.${CLIENT_BUILD:-70685}
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-127.0.0.1}
      CA_CERT: /certs/ca/forever_root_ca.crt
      LAUNCHER_LINUX_URL: ${LAUNCHER_LINUX_URL:-}
      LAUNCHER_WINDOWS_URL: ${LAUNCHER_WINDOWS_URL:-}
      LAUNCHER_MAC_URL: ${LAUNCHER_MAC_URL:-}
      LAUNCHER_REPO: ${LAUNCHER_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SIGNUPS_PER_IP_PER_HOUR: ${SIGNUPS_PER_IP_PER_HOUR:-3}
    expose:
      - "8000"
    # local access only (the public domain goes through the reverse proxy)
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8000"
    volumes:
      # only the CA's public certificate is read (never its key)
      - ${CERTS_DIR:-./certs}/ca/forever_root_ca.crt:/certs/ca/forever_root_ca.crt:ro
      # launchers served by /download/<os> (optional, see .env.example)
      - ${DOWNLOADS_DIR:-./downloads}:/downloads:ro

  # Companions brain (optional): AI workers that talk for the bots (Claude, Ollama, OpenAI-compatible servers).
  # Providers are set in the web panel (/companions > Server & AI). COMPANIONS_LLM=1 in .env, then:
  #   docker compose --profile brain up -d            (add --profile ollama for a local Ollama server)
  # A first Claude provider is added when ANTHROPIC_API_KEY is set. Brains on other machines: see docs/COMPANIONS.md.
  brain:
    build: ./docker/companions/brain
    image: ${BRAIN_IMAGE:-forever-companions-brain:latest}
    profiles: ["brain"]
    networks: [forever]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-trinity}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: characters
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMPANIONS_LLM_MODEL: ${COMPANIONS_LLM_MODEL:-claude-opus-5-5}
      COMPANIONS_LLM_EFFORT: ${COMPANIONS_LLM_EFFORT:-low}
      COMPANIONS_LLM_MAX_PER_MINUTE: ${COMPANIONS_LLM_MAX_PER_MINUTE:-60}

  # Local LLM server for the brain (optional): provider "Ollama", address http://ollama:11434.
  # Pull a model once: docker compose exec ollama ollama pull qwen2.5:7b
  # NVIDIA GPU: uncomment "deploy" (needs the NVIDIA container toolkit).
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.6.8}
    profiles: ["ollama"]
    networks: [forever]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
    volumes:
      - ollama-models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # Game data extraction from the client: docker compose run --rm extractor
  extractor:
    image: ${TRINITY_IMAGE:-ghcr.io/senkusx/forever_docker-trinitycore:latest}
    pull_policy: always
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/extract.sh"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      EXTRACT_MMAPS: ${EXTRACT_MMAPS:-0}
      CASC_PRODUCT: ${CASC_PRODUCT:-}   # empty: the Forever product .build.info lists (wowf, else wow_classic_beta)
    volumes:
      - "${WOW_DIR:-/path/to/World of Warcraft}:/wow:ro"
      - ${DATA_DIR:-./data}:/opt/trinitycore/data

# explicit internal network: a reverse proxy network added to the web service (e.g. Dokploy's) keeps this one,
# so the website always reaches mysql and worldserver
networks:
  forever:

volumes:
  mysql-data:
  logs:
  ollama-models:
